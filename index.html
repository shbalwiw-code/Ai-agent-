<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Agent</title>
    <!-- خطوط جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- مكتبة Google Auth -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        /* 16 Colors Theme Variables */
        :root {
            --bg-color: #ffffff;
            --text-color: #3c3c3c;
            --card-bg: #f7f7f7;
            --primary-color: #58cc02; /* Default Duolingo Green */
            --shadow-color: #58a700;
            --border-radius: 16px;
            --font-family: 'Cairo', sans-serif;
        }

        .dark-mode {
            --bg-color: #131415;
            --text-color: #ffffff;
            --card-bg: #202225;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            overflow-x: hidden;
        }

        /* 3D Duolingo Style Buttons */
        .btn-3d {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-bottom: 4px solid var(--shadow-color);
            border-radius: var(--border-radius);
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.1s ease-in-out;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }
        .btn-3d:active {
            transform: translateY(4px);
            border-bottom: 0px solid transparent;
            margin-bottom: 4px;
        }

        /* Views */
        .view {
            display: none;
            padding: 20px;
            min-height: 100vh;
            animation: fadeIn 0.4s ease;
        }
        .view.active {
            display: block;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Login View */
        #login-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 100vh;
        }
        .ai-icon { width: 150px; height: 150px; fill: var(--primary-color); margin-bottom: 20px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0% {transform: translateY(0px);} 50% {transform: translateY(-10px);} 100% {transform: translateY(0px);} }

        /* Dashboard & Header */
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 2px solid var(--card-bg); margin-bottom: 20px; }
        .header-icons svg { width: 32px; height: 32px; fill: var(--primary-color); cursor: pointer; }

        /* AI Messages */
        .message-card {
            background-color: var(--card-bg);
            border: 2px solid var(--card-bg);
            border-radius: var(--border-radius);
            padding: 16px;
            margin-bottom: 15px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.05);
        }
        .message-date { font-size: 12px; color: gray; margin-bottom: 8px; }
        .message-content p { margin-bottom: 10px; line-height: 1.6; }
        .message-actions { display: flex; gap: 10px; margin-top: 15px; }
        .btn-icon { background: transparent; border: 2px solid var(--card-bg); border-radius: 12px; padding: 8px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; width: 50px; }
        .btn-icon:hover { background-color: var(--primary-color); fill: white; border-color: var(--shadow-color); }
        .btn-icon svg { width: 20px; height: 20px; fill: var(--text-color); }

        /* Bottom Date Slider */
        .date-slider {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 10px 0;
            scrollbar-width: none; /* Firefox */
        }
        .date-slider::-webkit-scrollbar { display: none; }
        .date-item {
            min-width: 60px;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            border-bottom: 3px solid rgba(0,0,0,0.1);
        }
        .date-item.active { background-color: var(--primary-color); color: white; border-color: var(--shadow-color); }

        /* Settings View */
        .settings-group { background: var(--card-bg); padding: 15px; border-radius: var(--border-radius); margin-bottom: 20px; }
        .settings-group h3 { margin-bottom: 10px; font-size: 16px; }
        textarea, select, input { width: 100%; padding: 12px; border-radius: 12px; border: 2px solid rgba(0,0,0,0.1); background: var(--bg-color); color: var(--text-color); font-size: 14px; margin-bottom: 10px; outline: none; }
        textarea:focus { border-color: var(--primary-color); }
        
        /* 16 Colors Grid */
        .color-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; margin-bottom: 10px; }
        .color-swatch { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .color-swatch.active { border-color: var(--text-color); transform: scale(1.1); }

        /* Vertical Time Slider (Scrollable) */
        .time-slider-container {
            height: 150px;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            background: var(--bg-color);
            border-radius: 12px;
            border: 2px solid rgba(0,0,0,0.1);
            position: relative;
        }
        .time-slider-container::-webkit-scrollbar { width: 0; }
        .time-item {
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 800;
            color: gray;
            scroll-snap-align: center;
            transition: 0.3s;
        }
        .time-item.active { color: var(--primary-color); font-size: 24px; }
        
        /* Skeleton Loading */
        .skeleton {
            background: linear-gradient(90deg, var(--card-bg) 25%, rgba(150,150,150,0.2) 50%, var(--card-bg) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
            height: 20px;
            margin-bottom: 10px;
        }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

        /* Toggle Switch */
        .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-color); }
        input:checked + .slider:before { transform: translateX(22px); }
        .toggle-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }

    </style>
</head>
<body>

    <!-- 1. واجهة تسجيل الدخول -->
    <div id="login-view" class="view active">
        <!-- أيقونة الروبوت -->
        <svg class="ai-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

        <!-- زر جوجل يظهر هنا -->
        <div id="g_id_onload"

    <!-- 2. واجهة الداشبورد -->
    <div id="dashboard-view" class="view">
        <header>
            <div>
                <h2>مرحباً، <span id="user-name-display"></span></h2>
            </div>
            <div class="header-icons">
                <svg onclick="app.showView('settings-view')" viewBox="0 0 24 24"><path d="M12 15.5C13.933 15.5 15.5 13.933 15.5 12C15.5 10.067 13.933 8.5 12 8.5C10.067 8.5 8.5 10.067 8.5 12C8.5 13.933 10.067 15.5 12 15.5Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </div>
        </header>

        <div id="ai-messages-container">
            <!-- Skeleton Loader -->
            <div id="skeleton-loader" style="display:none;">
                <div class="message-card">
                    <div class="skeleton" style="width: 30%;"></div>
                    <div class="skeleton" style="width: 100%;"></div>
                    <div class="skeleton" style="width: 80%;"></div>
                    <div class="skeleton" style="width: 90%;"></div>
                </div>
            </div>
            <!-- الرسائل ستضاف هنا -->
        </div>

        <button class="btn-3d" onclick="app.requestNewAiAnalysis()" style="margin-top:20px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            توليد بحث جديد الآن
        </button>

        <div style="margin-top: 30px;">
            <h4 style="margin-bottom:10px; color:gray;">التقويم (اسحب)</h4>
            <div class="date-slider" id="bottom-date-slider"></div>
        </div>
    </div>

    <!-- 3. واجهة الإعدادات -->
    <div id="settings-view" class="view">
        <header>
            <h2>إعدادات الذكاء الاصطناعي</h2>
            <div class="header-icons">
                <svg onclick="app.showView('dashboard-view')" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </div>
        </header>

        <div class="settings-group">
            <h3>صندوق الكتابة (البروفايل والاهتمامات)</h3>
            <textarea id="profile-interests" rows="4" placeholder="أخبرني عن اهتماماتك (مثلاً: البرمجة، الألعاب، التقنية...)"></textarea>
            
            <div class="toggle-row">
                <span>تفعيل الذكاء السياقي</span>
                <label class="switch"><input type="checkbox" id="context-ai-toggle"><span class="slider"></span></label>
            </div>
            <div class="toggle-row">
                <span>تفعيل البحث في الإنترنت</span>
                <label class="switch"><input type="checkbox" id="web-search-toggle"><span class="slider"></span></label>
            </div>
        </div>

        <div class="settings-group">
            <h3>توقيت الانطلاق اليومي (الساعة)</h3>
            <div class="time-slider-container" id="time-slider">
                <!-- الأرقام من 1 إلى 24 تضاف عبر JS -->
            </div>
        </div>

        <div class="settings-group">
            <h3>مدة عمل الذكاء الاصطناعي</h3>
            <select id="duration-select">
                <option value="1-2">يوم أو يومين</option>
                <option value="4-8">أربعة أو ثمانية أيام</option>
                <option value="15">خمسة عشر يوماً</option>
                <option value="infinite">عدد لانهائي من الأيام</option>
            </select>
        </div>

        <div class="settings-group">
            <h3>المظهر</h3>
            <div class="toggle-row">
                <span>الوضع الليلي</span>
                <label class="switch"><input type="checkbox" id="dark-mode-toggle" onchange="app.toggleDarkMode()"><span class="slider"></span></label>
            </div>
            <div class="toggle-row">
                <span>الشاشة الكاملة</span>
                <button class="btn-3d" onclick="app.toggleFullScreen()" style="width:auto; padding: 5px 15px; font-size:12px;">تفعيل</button>
            </div>
            <h4 style="margin-bottom:10px; margin-top:10px;">اختر الثيم (16 لوناً)</h4>
            <div class="color-grid" id="color-grid"></div>
        </div>

        <button class="btn-3d" onclick="app.saveSettingsAndContext()">حفظ وتعيين</button>
    </div>

    <!-- كود المنطق (JavaScript) -->
    <script>
        // --- 1. مفاتيح الـ API ---
        const SUPABASE_URL = 'https://icvcijbkhndigtsktlgx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImljdmNpamJraG5kaWd0c2t0bGd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyMzc1NDIsImV4cCI6MjA5NTgxMzU0Mn0.oY84clpkpzsHgn9sji3x3Y_9crmC6QI-DMdG_-578nA';
        const WORKER_URL = 'https://dry-block-6fb9.angdd336.workers.dev';

        // تهيئة Supabase
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- 2. بيانات التطبيق الأساسية ---
        const colors = [
            '#58cc02', '#1cb0f6', '#ff4b4b', '#ffc800', '#ce82ff', '#2b70c9', '#ff9600', '#00c3af',
            '#f272a8', '#897463', '#a5edff', '#ffb0c7', '#574246', '#000000', '#74b816', '#fcc419'
        ];
        
        const app = {
            currentUser: null,
            
            init() {
                this.renderColors();
                this.renderTimeSlider();
                this.renderDateSlider();
                
                // إضافة أحداث التمرير للوقت لجعله يضيء بالأبيض عند الوقوف (Active)
                const timeSlider = document.getElementById('time-slider');
                timeSlider.addEventListener('scroll', () => {
                    let items = document.querySelectorAll('.time-item');
                    let center = timeSlider.scrollTop + (timeSlider.clientHeight / 2);
                    items.forEach(item => {
                        let itemCenter = item.offsetTop + (item.clientHeight / 2);
                        if(Math.abs(center - itemCenter) < 25) {
                            item.classList.add('active');
                            item.style.color = document.body.classList.contains('dark-mode') ? '#fff' : '#000';
                        } else {
                            item.classList.remove('active');
                            item.style.color = 'gray';
                        }
                    });
                });
            },

            showView(viewId) {
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                document.getElementById(viewId).classList.add('active');
            },

            toggleDarkMode() {
                const isDark = document.getElementById('dark-mode-toggle').checked;
                if(isDark) document.body.classList.add('dark-mode');
                else document.body.classList.remove('dark-mode');
            },

            toggleFullScreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => console.log(err));
                } else {
                    document.exitFullscreen();
                }
            },

            changeTheme(color) {
                document.documentElement.style.setProperty('--primary-color', color);
                // لون الظل يكون أغمق قليلاً (تبسيطاً نضع شفافية)
                document.documentElement.style.setProperty('--shadow-color', this.adjustColor(color, -30));
                
                // تحديث الـ Manifest PWA ديناميكياً لتغيير لون أيقونة الروبوت
                this.generateDynamicManifest(color);
            },

            adjustColor(color, amount) {
                return '#' + color.replace(/^#/, '').replace(/../g, color => ('0'+Math.min(255, Math.max(0, parseInt(color, 16) + amount)).toString(16)).substr(-2));
            },

            renderColors() {
                const grid = document.getElementById('color-grid');
                grid.innerHTML = '';
                colors.forEach(color => {
                    const div = document.createElement('div');
                    div.className = 'color-swatch';
                    div.style.backgroundColor = color;
                    div.onclick = () => {
                        document.querySelectorAll('.color-swatch').forEach(c => c.classList.remove('active'));
                        div.classList.add('active');
                        this.changeTheme(color);
                    };
                    grid.appendChild(div);
                });
            },

            renderTimeSlider() {
                const slider = document.getElementById('time-slider');
                slider.innerHTML = '';
                // حلقتان لإنشاء حلقة لا نهائية تقريباً (تكرار الأرقام من 1 لـ 24)
                for(let j=0; j<3; j++){
                    for(let i = 1; i <= 24; i++) {
                        const div = document.createElement('div');
                        div.className = 'time-item';
                        div.dataset.time = i;
                        div.innerText = i + ':00';
                        slider.appendChild(div);
                    }
                }
            },

            renderDateSlider() {
                const slider = document.getElementById('bottom-date-slider');
                slider.innerHTML = '';
                const days = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
                const today = new Date();
                
                for(let i = -3; i <= 7; i++) {
                    const d = new Date(today);
                    d.setDate(today.getDate() + i);
                    const div = document.createElement('div');
                    div.className = `date-item ${i === 0 ? 'active' : ''}`;
                    div.innerHTML = `<strong>${days[d.getDay()]}</strong><br>${d.getMonth()+1}/${d.getDate()}`;
                    slider.appendChild(div);
                }
            },

            // PWA Manifest ديناميكي
            generateDynamicManifest(color) {
                const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="${color}"/><rect x="20" y="30" width="60" height="45" rx="10" fill="#fff"/><circle cx="35" cy="50" r="6" fill="${color}"/><circle cx="65" cy="50" r="6" fill="${color}"/><path d="M40 65 h20" stroke="${color}" stroke-width="4" stroke-linecap="round"/><path d="M50 15 v15" stroke="#fff" stroke-width="4" stroke-linecap="round"/><circle cx="50" cy="15" r="5" fill="#fff"/></svg>`;
                const svgBlob = new Blob([svgIcon], {type: 'image/svg+xml'});
                const iconUrl = URL.createObjectURL(svgBlob);

                const manifest = {
                    "name": "AI Context Agent",
                    "short_name": "AI Agent",
                    "start_url": ".",
                    "display": "standalone",
                    "background_color": document.body.classList.contains('dark-mode') ? '#131415' : '#ffffff',
                    "theme_color": color,
                    "icons": [{"src": iconUrl, "sizes": "192x192 512x512", "type": "image/svg+xml", "purpose": "any"}]
                };

                const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
                const manifestUrl = URL.createObjectURL(manifestBlob);
                
                let link = document.querySelector('link[rel="manifest"]');
                if (!link) {
                    link = document.createElement('link');
                    link.rel = 'manifest';
                    document.head.appendChild(link);
                }
                link.href = manifestUrl;
            },

            async loginSuccess(userEmail, userName) {
                this.currentUser = { email: userEmail, name: userName };
                document.getElementById('user-name-display').innerText = userName;
                
                // جلب بيانات المستخدم من Supabase
                const { data, error } = await supabase.from('users').select('*').eq('email', userEmail).single();
                
                if (!data) {
                    // مستخدم جديد
                    await supabase.from('users').insert([{ email: userEmail, name: userName }]);
                    this.showView('settings-view'); // فتح الإعدادات أول مرة
                } else {
                    // مستخدم قديم، تعيين الإعدادات
                    if(data.settings) {
                        this.changeTheme(data.settings.theme_color || '#58cc02');
                        document.getElementById('dark-mode-toggle').checked = data.settings.dark_mode;
                        this.toggleDarkMode();
                        document.getElementById('context-ai-toggle').checked = data.settings.context_ai;
                        document.getElementById('web-search-toggle').checked = data.settings.web_search;
                        document.getElementById('duration-select').value = data.settings.duration || '1-2';
                    }
                    if(data.interests) {
                        document.getElementById('profile-interests').value = data.interests;
                    }
                    this.showView('dashboard-view');
                    this.loadAiMessages();
                }
            },

            async saveSettingsAndContext() {
                const interests = document.getElementById('profile-interests').value;
                const activeTimeItem = document.querySelector('.time-item.active');
                const analysisTime = activeTimeItem ? activeTimeItem.dataset.time : 8;

                const settings = {
                    theme_color: document.documentElement.style.getPropertyValue('--primary-color') || '#58cc02',
                    dark_mode: document.getElementById('dark-mode-toggle').checked,
                    context_ai: document.getElementById('context-ai-toggle').checked,
                    web_search: document.getElementById('web-search-toggle').checked,
                    duration: document.getElementById('duration-select').value,
                    analysis_time: analysisTime
                };

                await supabase.from('users').update({ interests: interests, settings: settings }).eq('email', this.currentUser.email);
                
                alert('تم حفظ الإعدادات وسيتم تعليم الكلمات الهامة (Markdown) في السياق!');
                this.showView('dashboard-view');
            },

            async loadAiMessages() {
                const container = document.getElementById('ai-messages-container');
                document.getElementById('skeleton-loader').style.display = 'block';
                
                const { data, error } = await supabase.from('ai_messages')
                    .select('*')
                    .eq('user_email', this.currentUser.email)
                    .order('created_at', { ascending: false });
                
                document.getElementById('skeleton-loader').style.display = 'none';

                if (data && data.length > 0) {
                    container.innerHTML = data.map(msg => this.createMessageHTML(msg)).join('');
                } else {
                    container.innerHTML = '<p style="text-align:center; color:gray; margin-top:20px;">لا توجد رسائل حالياً. اطلب من الذكاء الاصطناعي بحثاً جديداً.</p>';
                }
            },

            createMessageHTML(msg) {
                // تحويل الماركداون الأساسي لـ HTML
                let formattedContent = msg.content.replace(/\*\*(.*?)\*\*/g, '<strong style="color:var(--primary-color)">$1</strong>');
                
                return `
                <div class="message-card" id="msg-${msg.id}">
                    <div class="message-date">${msg.send_date}</div>
                    <div class="message-content"><p>${formattedContent}</p></div>
                    ${msg.image_urls && msg.image_urls.length > 0 ? `<div style="display:flex; overflow-x:auto; gap:10px; margin-top:10px;"><img src="${msg.image_urls[0]}" style="height:100px; border-radius:8px;"></div>` : ''}
                    <div class="message-actions">
                        <button class="btn-icon" onclick="app.sendFeedback('${msg.id}', true)">👍</button>
                        <button class="btn-icon" onclick="app.sendFeedback('${msg.id}', false)">👎</button>
                    </div>
                </div>`;
            },

            async sendFeedback(msgId, isLiked) {
                const reason = prompt(isLiked ? "لماذا أعجبتك هذه النتيجة؟ (اختياري، المحرر الذكي سيفهم سياقك)" : "ما الذي تود تعديله في النتيجة؟");
                await supabase.from('ai_messages').update({ liked: isLiked, feedback: reason }).eq('id', msgId);
                alert('تم حفظ ملاحظاتك وسيتم تحديث ملف شخصيتك بانتظام!');
            },

            async requestNewAiAnalysis() {
                // 1. إظهار الأنيميشن
                document.getElementById('skeleton-loader').style.display = 'block';
                
                // جلب اهتمامات المستخدم
                const { data: user } = await supabase.from('users').select('*').eq('email', this.currentUser.email).single();
                
                const promptText = `المستخدم مهتم بـ: ${user.interests || 'تحديثات وتقنية'}. إعدادات السياق والبحث مفعلة. قدم بحثاً منظماً يبدأ بمقدمة، ثم ملخص الفكرة، ثم تفاصيل دقيقة (استخدم ** للكلمات الهامة).`;

                try {
                    // 2. إرسال الطلب إلى Cloudflare Worker
                    const response = await fetch(WORKER_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            // حسب طلبك: هنا سيتم استخدام groq/compound و openai/gpt-oss-120b.
                            // نمرر النموذج للـ Worker. إذا لم تكن هذه النماذج متاحة بالضبط على API سنستخدم النموذج القياسي Llama3 للعمل.
                            model: "llama3-70b-8192", 
                            messages: [{ role: "user", content: promptText }]
                        })
                    });

                    const result = await response.json();
                    const aiText = result.choices[0].message.content;

                    // 3. حفظ النتيجة في Supabase
                    const todayStr = new Date().toISOString().split('T')[0].replace(/-/g, '/');
                    await supabase.from('ai_messages').insert([{
                        user_email: this.currentUser.email,
                        send_date: todayStr,
                        content: aiText,
                        image_urls: [] // يمكن إضافة روابط الصور إذا توفرت
                    }]);

                    // 4. إعادة التحميل
                    this.loadAiMessages();

                } catch (error) {
                    console.error('Error:', error);
                    alert('حدث خطأ في الاتصال بالذكاء الاصطناعي.');
                    document.getElementById('skeleton-loader').style.display = 'none';
                }
            }
        };

        // دالة يتم استدعاؤها تلقائياً عند نجاح تسجيل الدخول من Google
        function handleCredentialResponse(response) {
            // فك تشفير الـ JWT للحصول على إيميل واسم المستخدم
            const payload = JSON.parse(atob(response.credential.split('.')[1]));
            app.loginSuccess(payload.email, payload.name);
        }

        // تشغيل التطبيق
        window.onload = () => app.init();
    </script>
</body>
</html>
